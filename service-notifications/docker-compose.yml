version: '3'

services:
  service-notifications:
    build: .
    image: ${SERVICENAME:-service-notifications}_service
    container_name: ${SERVICENAME:-service-notifications}_service
    ports:
      - "8091:8080"
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - APP_ENV=development
    volumes:
      - .:/app
    networks:
      - backend
      - enid_service_network

networks:
  backend:
    driver: bridge
  enid_service_network:
    external: true
